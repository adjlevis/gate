- name: Send Detailed Telegram Notification
        if: always()
        run: |
          python - << 'EOF'
          import os
          import re
          import json
          import urllib.request
          import urllib.parse

          bot_token = os.environ.get("TG_BOT_TOKEN")
          chat_id = os.environ.get("TG_CHAT_ID")
          deploy_outcome = os.environ.get("DEPLOY_OUTCOME", "unknown")

          if not bot_token or not chat_id:
              print("Telegram 密钥未配置，跳过发送")
              exit(0)

          raw_nodes = "0"
          sstp_nodes = "0"
          valid_nodes = "0"
          country_count = "0"
          residential = "0"

          try:
              json_path = os.path.join("public", "data.json")
              if os.path.exists(json_path):
                  with open(json_path, "r", encoding="utf-8") as jf:
                      data = json.load(jf)
                      valid_nodes = str(data.get("valid_count", data.get("total_valid", valid_nodes)))
                      country_count = str(data.get("country_count", country_count))
                      residential = str(data.get("residential_count", data.get("residential", residential)))
          except Exception as e:
              print(f"读取 data.json 出错: {e}")

          try:
              if os.path.exists("run.log"):
                  with open("run.log", "r", encoding="utf-8") as f:
                      content = f.read()
                      m_raw = re.search(r"获取原始节点[:：]?\s*(\d+)", content)
                      if m_raw: raw_nodes = m_raw.group(1)
                      m_sstp = re.search(r"SSTP\s*节点[:：]?\s*(\d+)", content, re.IGNORECASE)
                      if m_sstp: sstp_nodes = m_sstp.group(1)
                      if valid_nodes == "0":
                          m_valid = re.search(r"可用节点[:：]?\s*(\d+)", content)
                          if m_valid: valid_nodes = m_valid.group(1)
                      if country_count == "0":
                          m_country = re.search(r"国家数量[:：]?\s*(\d+)", content)
                          if m_country: country_count = m_country.group(1)
          except Exception as e:
              print(f"解析日志出错: {e}")

          if deploy_outcome == "success":
              message = (
                  "✅ *VPN Gate 节点检测与部署成功！*\n"
                  "──────────────────────\n"
                  f"📥 获取原始节点: `{raw_nodes}`\n"
                  f"🔧 SSTP 节点: `{sstp_nodes}`\n"
                  f"🟢 可用节点: `{valid_nodes}`\n"
                  f"🌍 国家数量: `{country_count}`\n"
                  f"🏠 住宅(估算): `{residential}`\n"
                  "──────────────────────\n"
                  "🌐 访问地址: [点击查看在线页面](https://dj56.is-a.dev/gate/)"
              )
          else:
              message = (
                  "❌ *VPN Gate 节点检测或部署失败！*\n"
                  "──────────────────────\n"
                  f"📥 获取原始节点: `{raw_nodes}`\n"
                  f"🔧 SSTP 节点: `{sstp_nodes}`\n"
                  "──────────────────────\n"
                  "🔍 请检查 GitHub Actions 运行日志。"
              )

          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "Markdown",
              "disable_web_page_preview": "true"
          }).encode('utf-8')

          try:
              req = urllib.request.Request(url, data=data, method="POST")
              with urllib.request.urlopen(req) as response:
                  print("Telegram 通知发送成功:", response.read().decode('utf-8'))
          except Exception as e:
              print("发送 Telegram 失败:", e)
          EOF
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
