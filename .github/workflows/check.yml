name: VPN Gate Node Check

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        id: run_script
        run: |
          # 运行 python 脚本并同时将输出记录到临时文件以便后续提取统计数据
          python vpngate.py 2>&1 | tee run.log
        env:
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://adjlevis.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'

      - name: Send Detailed Telegram Notification
        if: always()
        run: |
          python - << 'EOF'
          import os
          import re
          import urllib.request
          import urllib.parse

          bot_token = os.environ.get("TG_BOT_TOKEN")
          chat_id = os.environ.get("TG_CHAT_ID")
          deploy_outcome = os.environ.get("DEPLOY_OUTCOME", "unknown")

          if not bot_token or not chat_id:
              print("Telegram 密钥未配置，跳过发送")
              exit(0)

          # 从运行日志 run.log 中提取各项统计数据
          raw_nodes = "未知"
          sstp_nodes = "未知"
          valid_nodes = "未知"
          country_count = "未知"
          residential = "未知"

          try:
              if os.path.exists("run.log"):
                  with open("run.log", "r", encoding="utf-8") as f:
                      content = f.read()
                      
                      # 匹配日志中的对应字段
                      m_raw = re.search(r"获取原始节点[:：]\s*(\d+)", content)
                      if m_raw: raw_nodes = m_raw.group(1)
                      
                      m_sstp = re.search(r"SSTP 节点[:：]\s*(\d+)", content)
                      if m_sstp: sstp_nodes = m_sstp.group(1)
                      
                      m_valid = re.search(r"可用节点[:：]\s*(\d+)", content)
                      if m_valid: valid_nodes = m_valid.group(1)
                      
                      m_country = re.search(r"国家数量[:：]\s*(\d+)", content)
                      if m_country: country_count = m_country.group(1)
                      
                      m_res = re.search(r"住宅\(估算\)[:：]\s*(\d+)", content)
                      if m_res: residential = m_res.group(1)
          except Exception as e:
              print(f"解析日志出错: {e}")

          # 如果部署成功且获取到了数据，组装成清晰的 TG 消息
          if deploy_outcome == "success":
              message = (
                  "✅ *VPN Gate 住宅节点检测与部署成功！*\\n"
                  "──────────────────\\n"
                  f"📥 获取原始节点: `{raw_nodes}`\\n"
                  f"🔧 SSTP 节点: `{sstp_nodes}`\\n"
                  f"🟢 可用节点: `{valid_nodes}`\\n"
                  f"🌍 国家数量: `{country_count}`\\n"
                  f"🏠 住宅(估算): `{residential}`\\n"
                  "──────────────────\\n"
                  "🌐 访问地址: [点击查看在线页面](https://adjlevis.github.io/gate/)"
              )
          else:
              message = (
                  "❌ *VPN Gate 节点检测或部署失败！*\\n"
                  "──────────────────\\n"
                  f"📥 获取原始节点: `{raw_nodes}`\\n"
                  f"🔧 SSTP 节点: `{sstp_nodes}`\\n"
                  "──────────────────\\n"
                  "🔍 请检查 GitHub Actions 运行日志。"
              )

          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "Markdown",
              "disable_web_page_preview": "true"
          }).encode('utf-8')

          try:
              req = urllib.request.Request(url, data=data, method="POST")
              with urllib.request.urlopen(req) as response:
                  print("Telegram 通知发送成功:", response.read().decode('utf-8'))
          except Exception as e:
              print("发送 Telegram 失败:", e)
          EOF
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
